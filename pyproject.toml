[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-coalitions"
version = "0.1.0"
description = "Capability-search-based delegation system for multi-agent collaboration (MongoDB London hackathon)."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
